services:
  - type: web
    name: dashboard-agropecuario
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
